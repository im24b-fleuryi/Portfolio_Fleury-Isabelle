<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Portfolio - Isabelle Fleury</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* make navbar fixed and ensure only comments box scrolls */
        .navbar-game {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: transparent
        }

        body {
            margin: 0;
            padding-top: 56px;
            overflow: hidden
        }

        .comments-section {
            max-width: 800px;
            margin: 2rem auto;
            font-family: Arial, Helvetica, sans-serif;
        }

        #comments-list {
            max-height: 60vh;
            overflow: auto;
            padding: 0 0.25rem
        }

        /* ensure textarea and form remain visible and do not scroll with page */
        #comment-form {
            position: relative
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body class="body-faq">
    <nav class="navbar-game">
        <div class="container">
            <a class="nav-links" href="index.html">Home</a>
            <a class="nav-links" href="projects.html">My Projects</a>
            <a class="nav-links" href="cv.html">My CV</a>
            <a class="nav-links" href="faq.html">FAQ</a>
        </div>
    </nav>

    <main class="comments-section">
        <h1>FAQ & Comments</h1>

        <section>
            <h2>Comments</h2>
            <ul id="comments-list" style="list-style:none;padding:0"></ul>
        </section>

        <section id="comment-form" style="margin-top:2rem;margin-bottom:1rem">
            <label for="comment-input">Leave a comment</label><br>
            <textarea id="comment-input" rows="4" placeholder="Write your comment here..."
                style="width:100%;resize:none;text-align:center;"></textarea>
            <div style="margin-top:.5rem">
                <button id="post-btn" type="button">Post comment</button>
            </div>
            <p style="font-size:0.9rem;color:#666;margin-top:.5rem">Comments are shared with all visitors.</p>
        </section>
    </main>

    <script>
        // List of sample random names
        const NAMES = [
            'Luna', 'Orion', 'Echo', 'Nova', 'Indigo', 'Atlas', 'Pixel', 'Quinn', 'Sage', 'Raven',
            'Zephyr', 'Miso', 'Coco', 'Skye', 'Blaze', 'Marin', 'Ivy', 'Remy', 'Basil', 'Pip'
        ];

        // Get or create a persistent username for this browser
        function getPersistentName() {
            const key = 'faq_persistent_name_v1';
            let name = localStorage.getItem(key);
            if (!name) {
                // create deterministic random choice using crypto for more entropy
                const idx = Math.floor(window.crypto.getRandomValues(new Uint32Array(1))[0] / (0xffffffff + 1) * NAMES.length);
                name = NAMES[idx] + Math.floor(Math.random() * 900 + 100); // add number to reduce collisions
                localStorage.setItem(key, name);
            }
            return name;
        }

        const USERNAME = getPersistentName();

        // Comments are stored in localStorage so they persist across reloads and across tabs on same origin
        // For universal sharing across all users, replace storage calls with server-side API/database.
        const COMMENTS_KEY = 'faq_comments_v1_local';

        function loadComments() {
            const raw = localStorage.getItem(COMMENTS_KEY);
            return raw ? JSON.parse(raw) : [];
        }

        function saveComments(list) {
            localStorage.setItem(COMMENTS_KEY, JSON.stringify(list));
        }

        function renderComments() {
            const list = loadComments();
            const ul = document.getElementById('comments-list');
            ul.innerHTML = '';
            for (const c of list) {
                const li = document.createElement('li');
                li.style.border = '1px solid #ddd';
                li.style.padding = '8px';
                li.style.marginBottom = '8px';
                const meta = document.createElement('div');
                meta.style.fontSize = '0.9rem';
                meta.style.color = '#333';
                meta.textContent = c.name + ' • ' + new Date(c.t).toLocaleString();
                const body = document.createElement('div');
                body.style.marginTop = '6px';
                body.textContent = c.text;
                li.appendChild(meta);
                li.appendChild(body);
                ul.appendChild(li);
            }
        }

        function postComment() {
            const ta = document.getElementById('comment-input');
            const text = ta.value.trim();
            if (!text) return;
            const comments = loadComments();
            comments.unshift({ name: USERNAME, text, t: Date.now() });
            saveComments(comments);
            ta.value = '';
            renderComments();
        }

        document.getElementById('post-btn').addEventListener('click', postComment);

        document.getElementById('comment-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                postComment();
            }
        });

        // initial render
        renderComments();
    </script>
</body>

</html>
